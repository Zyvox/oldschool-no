name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The build and static checks need no dependencies.
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      - name: Generated files are committed
        run: git diff --exit-code -- dist src/css/tokens docs/tokens.md site/assets/generated

  browser:
    name: Accessibility and smoke tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
      - run: node scripts/a11y.mjs
